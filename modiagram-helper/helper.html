<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" id="theme-link" href="./css/style-light.css">
    <title>MO-Diagram Generator</title>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$']]
            },
            options: {
                // Dies hilft, wenn Elemente dynamisch per JS hinzugefügt werden
                processHtmlClass: 'tex2jax_process'
            }
        };
    </script>


</head>

<body>
    <h1>MO-Diagram Generator <img src="./data/icon.png" alt="icon"></h1>
    <br>
    <div class="file-controls">

        <select id="project-selector" onchange="switchProject()">
            <option value="null">-- Select Project --</option>
        </select>
        <button onclick="newProject()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024">
                <path d="M0 0h1024v1024H0z" fill="none" />
                <path fill="currentColor"
                    d="M854.6 288.6L639.4 73.4c-6-6-14.1-9.4-22.6-9.4H192c-17.7 0-32 14.3-32 32v832c0 17.7 14.3 32 32 32h640c17.7 0 32-14.3 32-32V311.3c0-8.5-3.4-16.7-9.4-22.7M790.2 326H602V137.8zm1.8 562H232V136h302v216a42 42 0 0 0 42 42h216zM544 472c0-4.4-3.6-8-8-8h-48c-4.4 0-8 3.6-8 8v108H372c-4.4 0-8 3.6-8 8v48c0 4.4 3.6 8 8 8h108v108c0 4.4 3.6 8 8 8h48c4.4 0 8-3.6 8-8V644h108c4.4 0 8-3.6 8-8v-48c0-4.4-3.6-8-8-8H544z" />
            </svg>

        </button>
        <button onclick="saveProject()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024">
                <path d="M0 0h1024v1024H0z" fill="none" />
                <path fill="currentColor"
                    d="M893.3 293.3L730.7 130.7c-7.5-7.5-16.7-13-26.7-16V112H144c-17.7 0-32 14.3-32 32v736c0 17.7 14.3 32 32 32h736c17.7 0 32-14.3 32-32V338.5c0-17-6.7-33.2-18.7-45.2M384 184h256v104H384zm456 656H184V184h136v136c0 17.7 14.3 32 32 32h320c17.7 0 32-14.3 32-32V205.8l136 136zM512 442c-79.5 0-144 64.5-144 144s64.5 144 144 144s144-64.5 144-144s-64.5-144-144-144m0 224c-44.2 0-80-35.8-80-80s35.8-80 80-80s80 35.8 80 80s-35.8 80-80 80" />
            </svg>

        </button>

        <button onclick="deleteProject()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 1024 1024">
                <path d="M0 0h1024v1024H0z" fill="none" />
                <path fill="currentColor"
                    d="M160 256H96a32 32 0 0 1 0-64h256V96a32 32 0 0 1 32-32h256a32 32 0 0 1 32 32v96h256a32 32 0 1 1 0 64h-64v672a32 32 0 0 1-32 32H192a32 32 0 0 1-32-32zm448-64v-64H416v64zM224 896h576V256H224zm192-128a32 32 0 0 1-32-32V416a32 32 0 0 1 64 0v320a32 32 0 0 1-32 32m192 0a32 32 0 0 1-32-32V416a32 32 0 0 1 64 0v320a32 32 0 0 1-32 32" />
            </svg>

        </button>

        <input type="text" id="file_name_save" value="unnamed" style="border-style: dashed;">

        <button onclick="exportProject()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="currentColor" fill-rule="evenodd"
                    d="m13 13.175l3.243-3.242l1.414 1.414L12 17.004l-5.657-5.657l1.414-1.414L11 13.175V2h2zM4 16h2v4h12v-4h2v4c0 1.1-.9 2-2 2H6c-1.1 0-2-.963-2-2z" />
            </svg>


        </button>

        <input type="file" id="file-upload" style="display:none" accept=".json">
        <button onclick="document.getElementById('file-upload').click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 48 48">
                <path d="M0 0h48v48H0z" fill="none" />
                <path fill="#F8BBD0"
                    d="M7 40V8c0-2.2 1.8-4 4-4h24c2.2 0 4 1.8 4 4v32c0 2.2-1.8 4-4 4H11c-2.2 0-4-1.8-4-4" />
                <g fill="#E91E63">
                    <path d="M13.3 24L24 15v18z" />
                    <path d="M19 21h23v6H19z" />
                </g>
            </svg>





        </button>
        <label id="unsaved_notifier"></label>
        <button id="theme_switch" onclick="switchTheme()">&#x263D</button>
        <!-- <button onclick="load()">Projekt Laden</button> -->
        <div class="menu-container">
            <button class="menu-button">&#8942;</button>
            <div class="dropdown-content">
                <a href="https://github.com/thevicraft/modiagram-latex-integration#-how-to-use-in-latex"
                    target="_blank">How to use</a>
                <a href="https://github.com/thevicraft/modiagram-latex-integration/issues" target="_blank">Report
                    Issue</a>
                <hr>
                <a href="https://github.com/thevicraft/modiagram-latex-integration" target="_blank">Repo</a>
                <a href="https://ctan.org/pkg/mohelper" target="_blank">CTAN</a>
            </div>
        </div>

    </div>
    <br>
    <div id=dreispalten style="display: flex;">

    </div>
    <br>
    <button onclick="evaluateIt();window.scrollTo(0, document.getElementById('output').offsetTop);"
        style="background: #4CAF50; color: white;">Generate LaTeX Code</button>
    <br>
    <div class="output-area">
        <div class="nice_box" id="diagram-settings">
            <ul>
                <li><label>
                        <input type="checkbox" onchange="compact = this.checked;evaluateIt();" id="compact" unchecked>
                        Compact
                    </label></li>
                <li><label>
                        <input type="checkbox" onchange="energy_scale = this.checked;evaluateIt();"
                            id="add_energy_scale" unchecked>
                        Add energy scale
                    </label></li>
                <hr>
                <li>
                    <label>
                        Column distance:
                        <input class="file-controls" onchange="column_width=Number(this.value);evaluateIt();"
                            type="number" id="column_width" step="0.1" value="3">
                    </label>
                </li>
                <hr>

                <li>
                    <label><input type="checkbox" onchange="expandLabel(this.checked)" unchecked>
                        Show individual labels
                    </label>
                </li>
                <hr>
                <li>
                    <button onclick="calculateMOs();">predict MOs (experimental)</button>
                </li>
                <hr>
                <hr>
                <li><label>
                        <input type="checkbox" onchange="disable_mathjax = this.checked;evaluateIt();"
                            id="disable_mathjax" unchecked>
                        Disable MathJax in preview
                    </label></li>
            </ul>
        </div>

        <div class="preview-container">
            <!-- <h3>Live-Vorschau</h3> -->
            <svg id="mo-preview" preserveAspectRatio="xMidYMid meet">
            </svg>
        </div>
    </div>

    <h2>LaTeX Output</h2>
    <div class="output-area">
        <div class="nice_box" id="figure-settings-container">
            <label id="make_figure_label">
                <input type="checkbox"
                    onchange="document.getElementById('figure-settings').hidden=!this.checked;evaluateIt();"
                    id="make_figure" checked>
                Create figure
            </label>
            <div id="figure-settings">
                <ul>
                    <li>
                        <label>
                            centered:
                            <input onchange="evaluateIt();" type="checkbox" id="figure-centered" checked>
                        </label>
                    </li>
                    <li>
                        <label>
                            reference:
                            <input class="file-controls" onchange="evaluateIt();" type="text" id="figure-reference"
                                value="fig:modiagram1">
                        </label>
                    </li>
                    <li>
                        <label>
                            caption:
                            <input class="file-controls" onchange="evaluateIt();" type="text" id="figure-caption"
                                value="">
                        </label>
                    </li>
                </ul>
            </div>
            <button class="file-controls" onclick="copyToClipboard();">Copy to Clipboard</button>
        </div>
        <textarea id="output" readonly></textarea>
        <iframe class="file-controls" src="./mini_tutorial.html"></iframe>
    </div>

    <div id="license" class="nice_box">&copy; 2026 modiagram-latex-integration. Licensed under <a
            href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPL v3</a>.</div>

    <!-- <script>
        
    </script> -->
    <script src="helper.js"></script>

</body>

</html>
